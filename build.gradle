plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'com.orangehrm'
version = '1.0-SNAPSHOT'

sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

ext {
    seleniumVersion = '4.25.0'
    testngVersion = '7.10.2'
    allureVersion = '2.27.0'
    webdriverManagerVersion = '5.9.2'
}

dependencies {
    // Selenium
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"

    // TestNG
    testImplementation "org.testng:testng:${testngVersion}"

    // ✅ Allure (solo testImplementation)
    testImplementation "io.qameta.allure:allure-testng:${allureVersion}"
    testImplementation "io.qameta.allure:allure-java-commons:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"
    implementation "io.qameta.allure:allure-testng:${allureVersion}"
    implementation "io.qameta.allure:allure-java-commons:${allureVersion}"
    implementation "io.qameta.allure:allure-selenide:${allureVersion}"

    // WebDriverManager
    implementation "io.github.bonigarcia:webdrivermanager:${webdriverManagerVersion}"

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // Apache Commons IO
    implementation 'commons-io:commons-io:2.16.1'
}

allure {
    version = allureVersion
    useTestNG {
        version = allureVersion
    }
}

test {
    useTestNG {
        suites 'src/test/resources/testng.xml'
        useDefaultListeners = false
    }

    systemProperty "allure.results.directory", "build/allure-results"

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.register('cleanAllureResults', Delete) {
    delete 'build/allure-results'
}

tasks.register('runTestsWithReport', Test) {
    dependsOn 'cleanAllureResults'
    finalizedBy 'allureReport'
}

tasks.register('openAllureReport', Exec) {
    dependsOn 'allureReport'
    commandLine 'allure', 'open', 'build/allure-report'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

wrapper {
    gradleVersion = '8.4'
    distributionType = Wrapper.DistributionType.ALL
}
